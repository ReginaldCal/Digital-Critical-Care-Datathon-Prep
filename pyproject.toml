[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datathon-prep"
version = "0.2.0"
description = "Synthetic exercises accompanying Preparing Clinicians for ICU Datathons"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "duckdb>=1.4,<2", "sqlglot>=29,<30", "pandas>=2.2,<3", "matplotlib>=3.9,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools]
packages = ["datathon_prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
